[build-system]
    requires = ["hatchling", "hatch-requirements-txt"]
    build-backend = "hatchling.build"

[project]
    name = "inkler"
    version = "0.0.1"
    authors = [
      { name="Leo Zeitler" },
    ]
    requires-python = ">=3.9"
    classifiers = [
        "Programming Language :: Python :: 3",
        "Operating System :: OS Independent",
    ]

[tool.hatch.metadata.hooks.requirements_txt]
    files = ["requirements.txt"]
